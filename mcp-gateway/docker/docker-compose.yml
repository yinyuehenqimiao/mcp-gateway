services:
  mysql:
    image: mysql:8.0.36
    container_name: mcp-gateway-mysql
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "${MYSQL_HOST_PORT:3307}:3306"
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mcp_gateway}
      MYSQL_USER: ${MYSQL_USER:-mcp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mcp_gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis 不单独起：复用宿主机已有 Redis（默认 6379）
  # 或自行 docker start / docker run redis

volumes:
  mcp_gateway_mysql_data:
