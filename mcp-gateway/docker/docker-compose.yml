services:
  mysql:
    image: mysql:8.0.36
    container_name: mcp-gateway-mysql
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mcp_root_123
      MYSQL_DATABASE: mcp_gateway
      MYSQL_USER: mcp
      MYSQL_PASSWORD: mcp_pass_123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mcp_gateway_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umcp", "-pmcp_pass_123"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2
    container_name: mcp-gateway-redis
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru

volumes:
  mcp_gateway_mysql_data:
