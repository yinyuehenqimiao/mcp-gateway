server:
  port: ${SERVER_PORT:18190}
  tomcat:
    threads:
      max: 400
      min-spare: 20
    max-connections: 10000
    accept-count: 500
    connection-timeout: 20s

spring:
  application:
    name: mcp-gateway
  config:
    # 本地可复制 .env.example 为 .env（勿提交）；启动时自动加载
    import: optional:file:.env[.properties]
  main:
    # 引入 webflux 仅作 WebClient；保持 Servlet 栈
    web-application-type: servlet
  datasource:
    # characterEncoding 必须是 Java 字符集名 UTF-8（不能写 utf8mb4，否则连不上库并触发 Dialect 报错）
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3307/mcp_gateway?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 30
      initialization-fail-timeout: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  ai:
    mcp:
      server:
        name: mcp-gateway
        version: 1.0.0
        type: SYNC
        protocol: sse
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
  mvc:
    async:
      request-timeout: 35000

gateway:
  # 兼容旧入口 /sse 时加载的默认 MCP slug；多 Agent 请使用 /mcp/{slug}/sse
  default-server-slug: ${GATEWAY_DEFAULT_SERVER_SLUG:default}
  public-base-url: ${GATEWAY_PUBLIC_BASE_URL:http://localhost:18190}
  # tools/call 超时（毫秒）
  http-timeout-ms: ${GATEWAY_HTTP_TIMEOUT_MS:15000}
  jwt:
    # 与 demo-biz DEMO_JWT_SECRET 保持一致：MCP 可用下游 JWT 当 API Key
    enabled: ${GATEWAY_JWT_ENABLED:true}
    secret: ${GATEWAY_JWT_SECRET}
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    per-key-per-minute: ${GATEWAY_RATE_LIMIT_PER_KEY:60}
    per-tool-per-minute: ${GATEWAY_RATE_LIMIT_PER_TOOL:30}
  audit:
    mq:
      enabled: ${GATEWAY_AUDIT_MQ_ENABLED:true}
      topic: ${GATEWAY_AUDIT_MQ_TOPIC:mcp-audit_topic}
      consumer-group: ${GATEWAY_AUDIT_MQ_CONSUMER_GROUP:mcp-audit_cg}
      send-timeout-ms: ${GATEWAY_AUDIT_MQ_SEND_TIMEOUT_MS:2000}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: ${ROCKETMQ_MCP_AUDIT_PRODUCER_GROUP:mcp_audit_producer_group}
    send-message-timeout: 2000

logging:
  level:
    com.mcp.gateway: INFO
    com.mcp.gateway.service.tool.HttpToolForwarder: WARN
